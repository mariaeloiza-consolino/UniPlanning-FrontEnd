<mat-sidenav-container class="container">
  <!-- MENU LATERAL -->
  <mat-sidenav #drawer mode="over" class="sidenav" (click)="drawer.close()">
    <mat-nav-list>
      <a mat-list-item href="#">Página 1</a>
      <a mat-list-item href="#">Página 2</a>
      <a mat-list-item href="#">Página 3</a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- CONTEÚDO PRINCIPAL -->
  <mat-sidenav-content>
    <mat-toolbar class="fundo">
      <button mat-icon-button (click)="drawer.toggle()" aria-label="Menu lateral">
        <mat-icon class="icone-branco">menu</mat-icon>
      </button>
      <span class="titulo">
        <img src="imagens/Screenshot-removebg-preview.png">
      </span>
      <span class="example-spacer"></span>
      <button mat-icon-button aria-label="Perfil do usuário">
        <mat-icon class="icone-branco">person</mat-icon>
      </button>
    </mat-toolbar>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
