
<mat-toolbar class="fundo">
  <button matIconButton class="example-icon" aria-label="Example icon-button with menu icon">
    <mat-icon class="icone-branco">menu</mat-icon>
  </button>
  <span class="titulo"><img src="https://images.vexels.com/media/users/3/143402/isolated/preview/afbbf15d5e82a1c4fb5a55c4eacf3003-icone-de-chapeu-de-formatura.png"> <h1 class="primeiro-t">UNI</h1> <h1 class="segundo-t">PLANNING</h1></span>
  <span class="example-spacer"></span>
  <button matIconButton class="example-icon" aria-label="Example icon-button with share icon">
    <mat-icon class="icone-branco">person</mat-icon>
  </button>
</mat-toolbar>
<mat-sidenav-container class="container">
  <!-- MENU LATERAL -->
  <mat-sidenav #drawer mode="over" class="sidenav" (click)="drawer.close()">
    <mat-nav-list>
      <a mat-list-item href="#">Pagina 1</a>
      <a mat-list-item href="#">Pagina 2</a>
      <a mat-list-item href="#">Pagina 3</a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- CONTEÚDO PRINCIPAL -->
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span>Gerenciador de cursos</span>
    </mat-toolbar>

    <div class="content">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
