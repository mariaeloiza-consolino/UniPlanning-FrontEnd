<div class="principal">

  <h2 class="titulo">CADASTRO DE PROFESSOR</h2>
  <p class="subtitulo">INFORME OS DADOS PARA CONTINUAR</p>

  <div class="form">

    <mat-form-field appearance="outline">
      <mat-label>Nome</mat-label>
      <input matInput [(ngModel)]="novoProfessor.nome" placeholder="Ex: Otávio Almeida">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>CPF</mat-label>
      <input matInput [(ngModel)]="novoProfessor.cpf" placeholder="Ex: 123.456.789-00">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Data de Nascimento</mat-label>
      <input matInput type="date" [(ngModel)]="novoProfessor.dataNascimento">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" [(ngModel)]="novoProfessor.email" placeholder="exemplo@email.com">
    </mat-form-field>

    <button mat-raised-button color="primary" class="btn-salvar" (click)="salvarProfessor()">
      {{ editando ? 'ATUALIZAR' : 'SALVAR' }}
    </button>
  </div>

  <h3 class="titulo-lista">PROFESSORES</h3>

  <div class="lista" *ngIf="professores.length > 0; else vazio">

    <div class="linha" *ngFor="let professor of professores; let i = index">
      <span>
        <strong>{{ professor.nome }}</strong> —
        CPF: {{ professor.cpf }} —
        Email: {{ professor.email }}
      </span>
      <div class="acoes">
        <button mat-stroked-button color="primary" (click)="editarProfessor(i)">EDITAR</button>
        <button mat-stroked-button color="warn" (click)="excluirProfessor(i)">EXCLUIR</button>
      </div>
    </div>

  </div>

  <ng-template #vazio>
    <p class="sem-itens">Nenhum professor cadastrado ainda.</p>
  </ng-template>

</div>
